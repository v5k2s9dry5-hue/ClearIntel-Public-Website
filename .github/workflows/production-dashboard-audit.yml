name: Production dashboard visual audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit_production_dashboard.py'
      - '.github/workflows/production-dashboard-audit.yml'
permissions:
  contents: read
jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture deployed dashboard (informational)
        run: python scripts/audit_production_dashboard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-dashboard-audit
          path: production-dashboard-audit/
          retention-days: 7

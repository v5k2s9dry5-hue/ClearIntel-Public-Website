name: Production source probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/probe_production_sources.py'
      - '.github/workflows/production-source-probe.yml'
      - 'intelligence_feeds.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check deployed source availability (informational)
        run: python scripts/probe_production_sources.py
      - name: Install feed parser dependencies
        run: pip install -r requirements.txt
      - name: Verify candidate GDACS parser (informational)
        run: python scripts/probe_gdacs_parser.py
